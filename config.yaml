# Campus Microgrid & VPP Optimizer Configuration

tariffs:
  # Rajasthan RERC Time-of-Day (TOD) Structure (INR / kWh)
  off_peak_rate: 6.42   # 22:00 - 06:00
  normal_rate: 7.55     # 06:00 - 18:00
  peak_rate: 8.68       # 18:00 - 22:00
  export_rate: 3.50     # Feed-in compensation rate (INR / kWh)

battery:
  capacity_kwh: 200.0
  max_charge_kw: 50.0
  max_discharge_kw: 50.0
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  min_soc_pct: 0.20     # 20% Reserve margin
  max_soc_pct: 0.90     # 90% Maximum operating SoC
  reserve_margin_kwh: 40.0
  max_soc_kwh: 180.0
  ramp_limit_kw: 25.0   # Maximum hourly ramp rate for battery charge/discharge (kW/h)
  degradation_cost_inr_per_kwh: 0.85

grid:
  max_import_kw: 500.0
  max_export_kw: 200.0

carbon:
  emission_factor_kg_per_kwh: 0.81   # Central Electricity Authority (CEA) grid intensity
  carbon_cost_inr_per_kg: 2.0        # Shadow carbon price

optimizer:
  time_discretization_h: 1.0
  horizon_steps: 24
  solver_name: "highs"
  options:
    parallel: "on"
    presolve: "on"
    time_limit: 10.0
  slack_penalty: 100000.0  # Penalty factor for emergency reserve margin relaxation
